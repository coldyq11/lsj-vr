name: Desktop build (Windows)

on:
  push:
    branches: [main]
    paths: ['index.html', 'chaser.png', 'desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: LittleSaintJames-windows
          path: desktop/dist/*.exe
      - name: Publish release "desktop-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Little Saint James — desktop (Windows)
          prerelease: false
          make_latest: true
          files: desktop/dist/*.exe
